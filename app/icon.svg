<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ledger 1">
  <!-- The header's brand mark: a brass diamond on the app's ink background.
       Drawn on its own dark tile rather than transparent, so the light-on-dark
       mark stays visible against a browser's light tab strip. -->
  <rect width="32" height="32" rx="7" fill="#0f1620" />
  <rect x="10.5" y="10.5" width="11" height="11" rx="3" fill="#e8b14c"
        transform="rotate(45 16 16)" />
</svg>
